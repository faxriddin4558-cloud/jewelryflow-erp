# Instagram qisqa username qidiruvchi — faqat qo'lda ishga tushadi.
# Faqat tools/ig-username-finder papkasida ishlaydi; ERP/Goldia kodi, deployment va bazaga tegmaydi.
name: IG username finder

on:
  workflow_dispatch:
    inputs:
      max_checks:
        description: "Tekshiriladigan username soni (1-5)"
        required: true
        default: "5"
      lengths:
        description: "Uzunliklar, masalan: 2,3,4 yoki 4"
        required: true
        default: "2,3,4"
      types:
        description: "Turlar: digits,letters,mixed"
        required: true
        default: "digits,letters,mixed"

permissions:
  contents: read

concurrency:
  group: ig-username-finder
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/ig-username-finder
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ig-username-finder

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kiritilgan qiymatlarni tekshirish
        env:
          MAX_CHECKS: ${{ inputs.max_checks }}
          LENGTHS: ${{ inputs.lengths }}
          TYPES: ${{ inputs.types }}
        run: |
          [[ "$MAX_CHECKS" =~ ^[1-5]$ ]] || { echo "::error::max_checks 1 dan 5 gacha bo'lishi kerak"; exit 1; }
          [[ "$LENGTHS" =~ ^[234](,[234])*$ ]] || { echo "::error::lengths noto'g'ri"; exit 1; }
          [[ "$TYPES" =~ ^(digits|letters|mixed)(,(digits|letters|mixed))*$ ]] || { echo "::error::types noto'g'ri"; exit 1; }

      - name: Bog'liqliklar va Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Testlar
        run: npm test

      - name: Username tekshiruvi
        id: run
        env:
          MAX_CHECKS: ${{ inputs.max_checks }}
          LENGTHS: ${{ inputs.lengths }}
          TYPES: ${{ inputs.types }}
        run: |
          set +e
          node finder.cjs --max-checks "$MAX_CHECKS" --lengths "$LENGTHS" --types "$TYPES" \
            --min-delay 12 --max-delay 25 --out-dir output
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 3 ]; then
            echo "::warning::Instagram login/CAPTCHA/rate-limit aniqlandi — tekshiruv darhol to'xtatildi: $(cat output/stop_reason.txt)"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Xulosa
        if: always()
        run: |
          {
            echo "## IG username finder"
            [ -f output/stop_reason.txt ] && echo "**To'xtatildi:** $(cat output/stop_reason.txt)" && echo
            echo "### results.csv"; echo '```'; cat output/results.csv 2>/dev/null || echo "(yo'q)"; echo '```'
            echo "### top50.csv"; echo '```'; cat output/top50.csv 2>/dev/null || echo "(yo'q)"; echo '```'
            echo "> Yakuniy mavjudlik tekshiruvi faqat Instagram ilovasida qo'lda: Profilni tahrirlash → Foydalanuvchi nomi."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artifactlarni yuklash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-username-results
          path: |
            tools/ig-username-finder/output/results.csv
            tools/ig-username-finder/output/top50.csv
            tools/ig-username-finder/output/stop_reason.txt
          if-no-files-found: warn
          retention-days: 14
